[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npx vite"
  targetPort = 5173
  port = 8889

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
